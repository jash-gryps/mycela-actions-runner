name: heartbeat scheduler

# Reliable scheduler that does NOT depend on GitHub's flaky `schedule:` cadence.
# Each run is ONE tick — a catch-up dispatch pass, a wait, then it re-spawns
# itself via workflow_dispatch (which fires reliably via GITHUB_TOKEN). That
# forms a continuous chain. Short runs (vs one long loop) mean every tick's log
# is readable, so the run is observable and debuggable.
#
# TICK_INTERVAL IS A COST CONTROL — DO NOT SHORTEN IT WITHOUT READING THIS.
# Public repo = unlimited Actions minutes, so the chain is $0 on GitHub. But
# every tick runs schedule_dispatch.py, which OPENS A CONNECTION TO NEON. Neon
# bills compute by how long an endpoint stays awake, and an endpoint only
# suspends after `suspend_timeout_seconds` of idle. A tick interval shorter than
# that timeout means the endpoint can NEVER suspend — it is pinned awake 24/7.
#
# That is exactly what happened: a ~2.5-min tick against the default 300s
# suspend timeout kept prod awake ~100% of the time, burned the Neon free
# monthly compute quota by 2026-08-25, and took the whole system down — every
# dashboard login started failing as "Invalid username or password" and the
# notebook fleet stopped after run #1678.
#
# Keep BOTH of these true, or the quota goes again:
#   1. this interval stays comfortably ABOVE the endpoint's suspend timeout, and
#   2. the endpoint's suspend_timeout_seconds stays low (60s).
# At 15 min / 60s the scheduler costs ~1.6 h/day of awake time; the notebook
# runs themselves add ~3.8 h/day. Budget is ~13 h/day. See docs/NEON_BUDGET.md.
#
# Liveness/redundancy:
#  - re-spawn (with `if: always()`) keeps the chain going even if a tick errors;
#  - push-to-main + `schedule` (~every 15 min) bootstrap/recover the chain;
#  - concurrency cancel-in-progress => exactly one tick at a time, self-healing.
on:
  workflow_dispatch:
    inputs:
      dispatch_dry_run:
        description: "Dispatch run_notebook in dry-run mode (no real client contact)"
        type: boolean
        default: false
  schedule:
    - cron: '7 * * * *'   # hourly bootstrap/recovery only. NOT more often: a
                          # tick now lasts ~15 min and `cancel-in-progress` would
                          # kill a healthy in-flight tick on every scheduled fire.
  push:
    branches: [main]              # bootstrap the chain immediately on any main update

permissions:
  actions: write      # dispatch run_notebook + re-spawn self via GITHUB_TOKEN
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: true   # exactly one tick chain; newest wins

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet psycopg2-binary croniter

      - name: Catch-up dispatch pass
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          MAX_CATCHUP_MINUTES: '120'
          DISPATCH_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dispatch_dry_run) && '1' || '' }}
        run: python scripts/schedule_dispatch.py

      - name: Wait ~15 min, then re-spawn the next tick
        if: always()   # keep the chain alive even if the dispatch pass errored
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          sleep 900
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/heartbeat.yml/dispatches" \
            -d "{\"ref\":\"$GH_REF\"}"
